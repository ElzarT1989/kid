server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг (react-router BrowserRouter): неизвестные пути отдаём
    # index.html, чтобы клиентский роутер сам разобрался с /play/:childId.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
